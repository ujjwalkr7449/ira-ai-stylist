services:
  - type: web
    name: ira-ai-stylist
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ira-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ENABLE_LOCAL_IMAGE_GENERATION
        value: "false"
      - key: SEED_DATABASE
        value: "true"

databases:
  - name: ira-db
    databaseName: ira
    user: ira
    plan: free
